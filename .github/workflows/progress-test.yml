
name: BADSAH - Progress Overlay Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress-overlay-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify required files
        run: |
          test -f final_output.mp4
          test -f progress_test.py
          test -f assets/hanuman_flight.png

      - name: Generate progress overlay test
        run: python progress_test.py

      - name: Upload test video
        uses: actions/upload-artifact@v4
        with:
          name: BADSAH-Progress-Test
          path: progress_test.mp4
          if-no-files-found: error
