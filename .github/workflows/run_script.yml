name: BADSAH - Automatic Episode Generator

on:
  workflow_dispatch:

  schedule:
    # Daily at 5:30 AM India time (00:00 UTC)
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: badsah-episode-generation
  cancel-in-progress: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. FFMPEG
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version
          ffprobe -version

      # ==========================================
      # 4. PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 5. SCRIPT + RESEARCH GENERATION
      # GEMINI + GOOGLE SEARCH
      # ==========================================

      - name: Generate Scripture Research and Script
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python main.py

          python - <<'PY'
          import json
          import os

          required_files = [
              "story_output.json",
              "research_sources.json",
              "fact_generation_report.json"
          ]

          for path in required_files:
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  raise SystemExit(f"Missing output: {path}")

          with open("story_output.json", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              scenes = data.get("scenes")
          elif isinstance(data, list):
              scenes = data
          else:
              scenes = None

          if not isinstance(scenes, list):
              raise SystemExit("Invalid scenes format.")

          if len(scenes) != 7:
              raise SystemExit(
                  f"Expected 7 scenes, got {len(scenes)}"
              )

          for index, scene in enumerate(scenes, 1):
              for field in ("scene_id", "dialogue", "image_prompt"):
                  if not scene.get(field):
                      raise SystemExit(
                          f"Scene {index}: missing {field}"
                      )

          print("SCRIPT VALIDATION PASSED")
          print("Scenes:", len(scenes))
          print("Research and script files verified.")
          PY

      # ==========================================
      # 6. IMAGE GENERATION
      # CLOUDFLARE + POLLINATIONS BACKUP
      # ==========================================

      - name: Generate Scene Images
        timeout-minutes: 20
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: flux
        run: |
          python image_generator.py

          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          with open("story_output.json", encoding="utf-8") as f:
              data = json.load(f)

          scenes = data["scenes"] if isinstance(data, dict) else data

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene.get("scene_id", index))
              path = Path("images") / f"scene_{scene_id}.png"

              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Missing image: {path}")

              with Image.open(path) as img:
                  img.verify()

          print("ALL 7 IMAGES VERIFIED.")
          PY

      # ==========================================
      # 7. HINDI VOICE GENERATION
      # SARVAM + EDGE TTS BACKUP
      # ==========================================

      - name: Generate Scene Voiceovers
        timeout-minutes: 20
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: shubh_enhi_ads
        run: |
          python audio_generator.py

          python - <<'PY'
          import json
          from pathlib import Path

          with open("story_output.json", encoding="utf-8") as f:
              data = json.load(f)

          scenes = data["scenes"] if isinstance(data, dict) else data

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene.get("scene_id", index))
              path = Path("audio_files") / f"scene_{scene_id}.mp3"

              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Missing audio: {path}")

          print("ALL 7 AUDIO FILES VERIFIED.")
          PY

      # ==========================================
      # 8. VIDEO GENERATION
      # ==========================================

      - name: Create Final MP4
        timeout-minutes: 25
        run: |
          ffmpeg -version
          ffprobe -version

          python video_generator.py

          if [ ! -s final_output.mp4 ]; then
            echo "ERROR: final_output.mp4 was not created."
            exit 1
          fi

      # ==========================================
      # 9. FINAL VIDEO QUALITY CHECK
      # ==========================================

      - name: Verify Final Video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import os

          video = "final_output.mp4"

          if not os.path.isfile(video):
              raise SystemExit("Final MP4 is missing.")

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "stream=codec_type,width,height,codec_name",
                  "-show_entries",
                  "format=duration,size",
                  "-of", "json",
                  video
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          streams = data.get("streams", [])

          video_stream = next(
              (s for s in streams if s.get("codec_type") == "video"),
              None
          )

          audio_stream = next(
              (s for s in streams if s.get("codec_type") == "audio"),
              None
          )

          if not video_stream or not audio_stream:
              raise SystemExit("Video or audio stream missing.")

          if video_stream.get("width") != 1080:
              raise SystemExit("Incorrect video width.")

          if video_stream.get("height") != 1920:
              raise SystemExit("Incorrect video height.")

          duration = float(data["format"]["duration"])
          size = int(data["format"]["size"])

          if duration <= 0 or size < 100000:
              raise SystemExit("Invalid final video.")

          print("==============================")
          print("BADSAH FINAL VIDEO VERIFIED")
          print("==============================")
          print("Resolution: 1080x1920")
          print(f"Duration: {duration:.2f} seconds")
          print(f"Size: {size / 1024 / 1024:.2f} MB")
          print("Video:", video_stream.get("codec_name"))
          print("Audio:", audio_stream.get("codec_name"))
          print("==============================")
          PY

      # ==========================================
      # 10. SAVE OUTPUTS TO GITHUB
      # ==========================================

      - name: Commit Generated Episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            story_output.json \
            research_sources.json \
            fact_generation_report.json \
            image_generation_report.json \
            audio_timing_report.json \
            video_generation_report.json \
            images/ \
            audio_files/ \
            final_output.mp4

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "BADSAH automated episode generated [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ==========================================
      # 11. UPLOAD FINAL VIDEO ARTIFACT
      # ==========================================

      - name: Upload BADSAH Episode
        uses: actions/upload-artifact@v4
        with:
          name: BADSAH-Final-Episode
          path: |
            final_output.mp4
            story_output.json
            research_sources.json
            image_generation_report.json
            audio_timing_report.json
            video_generation_report.json
            images/
            audio_files/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # ==========================================
      # 12. SUCCESS
      # ==========================================

      - name: Completion Message
        if: success()
        run: |
          echo "===================================="
          echo "BADSAH EPISODE COMPLETED"
          echo "===================================="
          echo "Research: READY"
          echo "Script: READY"
          echo "Images: READY"
          echo "Voiceovers: READY"
          echo "Final MP4: READY"
          echo "GitHub Artifact: UPLOADED"
          echo "===================================="
