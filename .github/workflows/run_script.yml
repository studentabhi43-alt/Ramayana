name: BADSAH - Automatic Episode Generator

on:
  workflow_dispatch:

  schedule:
    # Daily at 5:30 AM India time
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: badsah-episode-generation
  cancel-in-progress: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. INSTALL FFMPEG AND HINDI FONTS
      # ==========================================

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

          ffmpeg -version
          ffprobe -version

      # ==========================================
      # 4. INSTALL PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 5. CHECK API CONFIGURATION
      # ==========================================

      - name: Check API Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "GEMINI_API_KEY",
              "GROQ_API_KEY",
              "SARVAM_API_KEY",
              "CLOUDFLARE_WORKER_URL",
              "POLLINATIONS_API_KEY"
          ]

          missing = [
              name for name in required
              if not os.getenv(name, "").strip()
          ]

          if missing:
              print("Missing GitHub Secrets:")
              for name in missing:
                  print("-", name)
              sys.exit(1)

          print("All required API secrets are configured.")
          PY

      # ==========================================
      # 6. GENERATE RESEARCH + SCRIPT
      # ==========================================

      - name: Generate Scripture Research and Script
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODELS: gemini-3.8-flash,gemini-3.8-flash-lite
          GROQ_MODEL: openai/gpt-oss-20b

        run: |
          python main.py

          python - <<'PY'
          import json
          import os
          import sys

          required_files = [
              "story_output.json",
              "research_sources.json",
              "fact_generation_report.json"
          ]

          for path in required_files:
              if not os.path.isfile(path):
                  sys.exit(f"Missing file: {path}")

              if os.path.getsize(path) == 0:
                  sys.exit(f"Empty file: {path}")

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          if not isinstance(scenes, list):
              sys.exit("Story output must be a JSON list.")

          if len(scenes) != 7:
              sys.exit("Expected exactly 7 scenes.")

          for index, scene in enumerate(scenes, 1):
              for field in [
                  "scene_id",
                  "dialogue",
                  "image_prompt",
                  "video_motion_prompt",
                  "claim_refs"
              ]:
                  if not scene.get(field):
                      sys.exit(
                          f"Scene {index} missing {field}"
                      )

          print("SCRIPT VALIDATION PASSED")
          print("Total scenes:", len(scenes))
          PY

      # ==========================================
      # 7. GENERATE SCENE IMAGES
      # ==========================================

      - name: Generate Scene Images
        timeout-minutes: 30
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: flux

        run: |
          python image_generator.py

          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from PIL import Image

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene["scene_id"])
              path = Path("images") / f"scene_{scene_id}.png"

              if not path.exists():
                  sys.exit(f"Missing image: {path}")

              if path.stat().st_size < 1000:
                  sys.exit(f"Invalid image: {path}")

              with Image.open(path) as img:
                  img.verify()

          print("ALL 7 IMAGES VERIFIED.")
          PY

      # ==========================================
      # 8. GENERATE VOICEOVERS
      # ==========================================

      - name: Generate Scene Voiceovers
        timeout-minutes: 30
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: shubh_enhi_ads

        run: |
          python audio_generator.py

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene["scene_id"])
              path = Path("audio_files") / f"scene_{scene_id}.mp3"

              if not path.exists():
                  sys.exit(f"Missing audio: {path}")

              if path.stat().st_size < 1000:
                  sys.exit(f"Invalid audio: {path}")

          print("ALL 7 AUDIO FILES VERIFIED.")
          PY

      # ==========================================
      # 9. CREATE ORIGINAL FINAL VIDEO
      # ==========================================

      - name: Create Final MP4
        timeout-minutes: 30
        run: |
          python video_generator.py

          if [ ! -s final_output.mp4 ]; then
            echo "ERROR: Original final MP4 missing."
            exit 1
          fi

          echo "ORIGINAL VIDEO CREATED."

      # ==========================================
      # 10. VERIFY ORIGINAL VIDEO
      # ==========================================

      - name: Verify Original Video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          video = "final_output.mp4"

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "stream=codec_type,width,height,codec_name",
                  "-show_entries",
                  "format=duration,size",
                  "-of", "json",
                  video
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          streams = data.get("streams", [])

          video_stream = next(
              (s for s in streams if s.get("codec_type") == "video"),
              None
          )

          audio_stream = next(
              (s for s in streams if s.get("codec_type") == "audio"),
              None
          )

          if not video_stream or not audio_stream:
              sys.exit("Original video or audio missing.")

          if video_stream.get("width") != 1080:
              sys.exit("Incorrect original video width.")

          if video_stream.get("height") != 1920:
              sys.exit("Incorrect original video height.")

          print("ORIGINAL VIDEO VERIFIED")
          print("Resolution: 1080x1920")
          print("Duration:", data["format"]["duration"])
          PY

      # ==========================================
      # 11. BADSAH POST-PRODUCTION
      # ==========================================

      - name: Create BADSAH Cinematic Version
        timeout-minutes: 40
        run: |
          python post_production.py

          if [ ! -s badsah_final.mp4 ]; then
            echo "ERROR: BADSAH upgraded video missing."
            exit 1
          fi

          if [ ! -s post_production_report.json ]; then
            echo "ERROR: Post-production report missing."
            exit 1
          fi

          echo "BADSAH POST-PRODUCTION COMPLETE"

      # ==========================================
      # 12. VERIFY UPGRADED VIDEO
      # ==========================================

      - name: Verify BADSAH Cinematic Video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          def probe(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries",
                      "stream=codec_type,width,height",
                      "-show_entries",
                      "format=duration,size",
                      "-of", "json",
                      path
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )
              return json.loads(result.stdout)

          original = probe("final_output.mp4")
          upgraded = probe("badsah_final.mp4")

          original_duration = float(
              original["format"]["duration"]
          )

          upgraded_duration = float(
              upgraded["format"]["duration"]
          )

          streams = upgraded.get("streams", [])

          video_stream = next(
              (s for s in streams if s.get("codec_type") == "video"),
              None
          )

          audio_stream = next(
              (s for s in streams if s.get("codec_type") == "audio"),
              None
          )

          if not video_stream or not audio_stream:
              sys.exit("Upgraded video/audio stream missing.")

          if video_stream.get("width") != 1080:
              sys.exit("Upgraded video width incorrect.")

          if video_stream.get("height") != 1920:
              sys.exit("Upgraded video height incorrect.")

          if abs(upgraded_duration - original_duration) > 0.35:
              sys.exit(
                  "Upgraded video duration differs from original. "
                  "Intro/outro are intentionally disabled."
              )

          print("BADSAH CINEMATIC VIDEO VERIFIED")
          print(f"Original duration: {original_duration:.2f}s")
          print(f"Upgraded duration: {upgraded_duration:.2f}s")
          print(
              f"Added duration: "
              f"{upgraded_duration - original_duration:.2f}s"
          )
          print("Resolution: 1080x1920")
          PY

      # ==========================================
      # 13. SAVE GENERATED EPISODE TO GITHUB
      # ==========================================

      - name: Commit Generated Episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            story_output.json \
            research_sources.json \
            fact_generation_report.json \
            image_generation_report.json \
            audio_timing_report.json \
            video_generation_report.json \
            post_production_report.json \
            images/ \
            audio_files/ \
            final_output.mp4 \
            badsah_final.mp4

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "BADSAH episode generated [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ==========================================
      # 14. UPLOAD FINAL VIDEO ARTIFACTS
      # ==========================================

      - name: Upload BADSAH Episodes
        uses: actions/upload-artifact@v4
        with:
          name: BADSAH-Final-Episodes
          path: |
            final_output.mp4
            badsah_final.mp4
            story_output.json
            research_sources.json
            fact_generation_report.json
            image_generation_report.json
            audio_timing_report.json
            video_generation_report.json
            post_production_report.json
            images/
            audio_files/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      # ==========================================
      # 15. AUTOMATIC YOUTUBE UPLOAD
      # ==========================================

      - name: Upload BADSAH Video to YouTube
        timeout-minutes: 30
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install google-api-python-client google-auth
          python youtube_uploader.py
      # ==========================================
      # 16. COMPLETION
      # ==========================================

      - name: BADSAH Completed
        if: success()
        run: |
          echo "=================================="
          echo "VEDIC GURU BADSAH"
          echo "=================================="
          echo "Research: COMPLETE"
          echo "Script: COMPLETE"
          echo "Images: COMPLETE"
          echo "Voiceovers: COMPLETE"
          echo "Original MP4: COMPLETE"
          echo "Cinematic MP4: COMPLETE"
          echo "Artifact: UPLOADED"
          echo "=================================="
