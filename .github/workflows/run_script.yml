name: BADSAH - Automatic Episode Generator

on:
  workflow_dispatch:

  schedule:
    # Daily at 5:30 AM India time
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: badsah-episode-generation
  cancel-in-progress: false

jobs:
  generate-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # 2. SETUP PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ==========================================
      # 3. INSTALL FFMPEG
      # ==========================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version
          ffprobe -version

      # ==========================================
      # 4. INSTALL PYTHON DEPENDENCIES
      # ==========================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # 5. CHECK API CONFIGURATION
      # ==========================================

      - name: Check API Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = [
              "GEMINI_API_KEY",
              "GROQ_API_KEY",
              "SARVAM_API_KEY",
              "CLOUDFLARE_WORKER_URL",
              "POLLINATIONS_API_KEY"
          ]

          missing = [
              name for name in required
              if not os.getenv(name, "").strip()
          ]

          if missing:
              print("Missing GitHub Secrets:")
              for name in missing:
                  print("-", name)
              sys.exit(1)

          print("All required API secrets are configured.")
          PY

      # ==========================================
      # 6. GENERATE RESEARCH + SCRIPT
      # GEMINI RESEARCH
      # GEMINI + GROQ PARALLEL SCRIPT
      # ==========================================

      - name: Generate Scripture Research and Script
        timeout-minutes: 15
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

          GEMINI_MODEL: gemini-3.8-flash
          GROQ_MODEL: openai/gpt-oss-20b

        run: |
          python main.py

          python - <<'PY'
          import json
          import os
          import sys

          required_files = [
              "story_output.json",
              "research_sources.json",
              "fact_generation_report.json"
          ]

          for path in required_files:
              if not os.path.isfile(path):
                  sys.exit(f"Missing file: {path}")

              if os.path.getsize(path) == 0:
                  sys.exit(f"Empty file: {path}")

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          if not isinstance(scenes, list):
              sys.exit("Story output must be a JSON list.")

          if len(scenes) != 7:
              sys.exit("Expected exactly 7 scenes.")

          for index, scene in enumerate(scenes, 1):
              for field in [
                  "scene_id",
                  "dialogue",
                  "image_prompt",
                  "video_motion_prompt",
                  "claim_refs"
              ]:
                  if not scene.get(field):
                      sys.exit(
                          f"Scene {index} missing {field}"
                      )

          print("SCRIPT VALIDATION PASSED")
          print("Total scenes:", len(scenes))
          PY

      # ==========================================
      # 7. GENERATE SCENE IMAGES
      # CLOUDFLARE + POLLINATIONS BACKUP
      # ==========================================

      - name: Generate Scene Images
        timeout-minutes: 30
        env:
          CLOUDFLARE_WORKER_URL: ${{ secrets.CLOUDFLARE_WORKER_URL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_MODEL: flux

        run: |
          python image_generator.py

          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          from PIL import Image

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene["scene_id"])
              path = Path("images") / f"scene_{scene_id}.png"

              if not path.exists():
                  sys.exit(f"Missing image: {path}")

              if path.stat().st_size < 1000:
                  sys.exit(f"Invalid image: {path}")

              with Image.open(path) as img:
                  img.verify()

          print("ALL 7 IMAGES VERIFIED.")
          PY

      # ==========================================
      # 8. GENERATE VOICEOVERS
      # SARVAM + EDGE TTS BACKUP
      # ==========================================

      - name: Generate Scene Voiceovers
        timeout-minutes: 30
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          SARVAM_SPEAKER: shubh_enhi_ads

        run: |
          python audio_generator.py

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          with open("story_output.json", encoding="utf-8") as f:
              scenes = json.load(f)

          for index, scene in enumerate(scenes, 1):
              scene_id = str(scene["scene_id"])
              path = Path("audio_files") / f"scene_{scene_id}.mp3"

              if not path.exists():
                  sys.exit(f"Missing audio: {path}")

              if path.stat().st_size < 1000:
                  sys.exit(f"Invalid audio: {path}")

          print("ALL 7 AUDIO FILES VERIFIED.")
          PY

      # ==========================================
      # 9. CREATE FINAL VIDEO
      # ==========================================

      - name: Create Final MP4
        timeout-minutes: 30
        run: |
          python video_generator.py

          if [ ! -s final_output.mp4 ]; then
            echo "ERROR: Final MP4 was not created."
            exit 1
          fi

      # ==========================================
      # 10. FINAL VIDEO QUALITY CHECK
      # ==========================================

      - name: Verify Final Video
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          import os

          video = "final_output.mp4"

          if not os.path.isfile(video):
              sys.exit("Final video missing.")

          result = subprocess.run(
              [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries",
                  "stream=codec_type,width,height,codec_name",
                  "-show_entries",
                  "format=duration,size",
                  "-of", "json",
                  video
              ],
              capture_output=True,
              text=True,
              check=True
          )

          data = json.loads(result.stdout)
          streams = data.get("streams", [])

          video_stream = next(
              (s for s in streams if s.get("codec_type") == "video"),
              None
          )

          audio_stream = next(
              (s for s in streams if s.get("codec_type") == "audio"),
              None
          )

          if not video_stream or not audio_stream:
              sys.exit("Video or audio stream missing.")

          if video_stream.get("width") != 1080:
              sys.exit("Incorrect video width.")

          if video_stream.get("height") != 1920:
              sys.exit("Incorrect video height.")

          duration = float(data["format"]["duration"])
          size = int(data["format"]["size"])

          if duration <= 0:
              sys.exit("Invalid duration.")

          print("BADSAH VIDEO VERIFIED")
          print("Resolution: 1080x1920")
          print(f"Duration: {duration:.2f}s")
          print(f"Size: {size / 1048576:.2f} MB")
          print("Video codec:", video_stream["codec_name"])
          print("Audio codec:", audio_stream["codec_name"])
          PY

      # ==========================================
      # 11. SAVE GENERATED EPISODE TO GITHUB
      # ==========================================

      - name: Commit Generated Episode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            story_output.json \
            research_sources.json \
            fact_generation_report.json \
            image_generation_report.json \
            audio_timing_report.json \
            video_generation_report.json \
            images/ \
            audio_files/ \
            final_output.mp4

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "BADSAH episode generated [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ==========================================
      # 12. UPLOAD FINAL VIDEO ARTIFACT
      # ==========================================

      - name: Upload BADSAH Episode
        uses: actions/upload-artifact@v4
        with:
          name: BADSAH-Final-Episode
          path: |
            final_output.mp4
            story_output.json
            research_sources.json
            image_generation_report.json
            audio_timing_report.json
            video_generation_report.json
            images/
            audio_files/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      # ==========================================
      # 13. COMPLETION
      # ==========================================

      - name: BADSAH Completed
        if: success()
        run: |
          echo "=================================="
          echo "BADSAH EPISODE GENERATED"
          echo "=================================="
          echo "Research: COMPLETE"
          echo "Script: COMPLETE"
          echo "Images: COMPLETE"
          echo "Voiceovers: COMPLETE"
          echo "Final MP4: COMPLETE"
          echo "Artifact: UPLOADED"
          echo "=================================="
