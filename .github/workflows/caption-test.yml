
name: BADSAH - Hindi Caption Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caption-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and Hindi Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install faster-whisper Pillow

      - name: Verify Required Files
        run: |
          test -f final_output.mp4
          test -f story_output.json
          test -f caption_test.py
          test -d audio_files
          ls audio_files/scene_*.mp3
          fc-match "Noto Sans Devanagari:style=Bold"

      - name: Generate V6 Moving Captions
        run: |
          python caption_test.py

      - name: Verify Generated Video
        run: |
          test -f captions_test.mp4
          test -f caption_test_report_v6.json
          ls -lh captions_test.mp4

      - name: Upload V6 Captioned Video
        uses: actions/upload-artifact@v4
        with:
          name: BADSAH-Caption-Video-V6
          path: |
            captions_test.mp4
            caption_test_report_v6.json
          if-no-files-found: error
          retention-days: 3
